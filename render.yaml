# Render Blueprint. Deploy with: https://dashboard.render.com/blueprints
#
# This uses a free web service. Render suspends free web services after 15
# minutes with no inbound requests, which would stop the loop - so point a free
# external pinger (https://uptimerobot.com) at the service URL every 5 minutes
# to keep it awake.

services:
  - type: web
    name: telegram-scheduler
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py loop
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: TELEGRAM_SESSION
        sync: false # base64-encoded .session file
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INTERVAL
        value: 1h
      - key: ROTATION
        value: sequential
      - key: SEND_ON_START
        value: "true"
